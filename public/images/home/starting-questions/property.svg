<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A welcoming family home</title>
  <desc id="description">An original flat-vector illustration of a blue-roofed family home, landscaped garden, and bright circular sky backdrop.</desc>

  <defs>
    <clipPath id="sky-clip">
      <circle cx="400" cy="327" r="246"/>
    </clipPath>
    <pattern id="brick-pattern" width="58" height="29" patternUnits="userSpaceOnUse">
      <path d="M0 0H58M0 29H58M29 0V14.5M0 14.5H58M0 14.5V29M58 14.5V29" stroke="#21304C" stroke-opacity=".13" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- The transparent page makes this illustration easy to place on a website. -->
  <g clip-path="url(#sky-clip)">
    <circle cx="400" cy="327" r="246" fill="#D7F4F3"/>
    <circle cx="580" cy="185" r="46" fill="#FFD56B"/>
    <path d="M154 444C233 400 297 445 367 416C435 388 518 433 646 397V575H154Z" fill="#A7DDB4"/>
    <path d="M154 498C269 449 357 509 455 464C527 432 588 476 646 448V575H154Z" fill="#7BC594"/>
    <g fill="#FFF" opacity=".92">
      <path d="M212 216c0-14 11-25 25-25 5 0 10 2 14 4 5-11 15-17 28-17 18 0 32 14 32 32v2c12 2 22 12 22 25h-121v-21Z"/>
      <path d="M439 262c0-10 8-18 19-18 3 0 7 1 10 3 3-8 11-13 20-13 13 0 23 10 23 23v1c9 1 16 9 16 18h-88v-14Z"/>
    </g>
  </g>

  <!-- Background shrubs. -->
  <g stroke="#21304C" stroke-width="6" stroke-linejoin="round">
    <path d="M171 491c-19 0-34-14-34-32 0-15 10-27 23-31-1-4-2-8-2-12 0-23 18-41 40-41s41 18 41 41c0 5-1 9-2 13 14 4 23 16 23 31 0 17-14 31-31 31H171Z" fill="#72BB81"/>
    <path d="M562 490c-13 0-24-10-24-23 0-10 6-19 16-22-1-3-1-5-1-8 0-17 13-30 30-30 16 0 30 13 30 30 0 3-1 6-2 9 10 3 17 12 17 22 0 12-10 22-22 22h-44Z" fill="#68B77A"/>
  </g>

  <!-- Main house and attached wing. -->
  <g stroke="#21304C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M383 306h220v186H383V306Z" fill="#E9E6D8"/>
    <path d="M425 258h178l44 97H395l30-97Z" fill="#E27463"/>
    <path d="M425 258h178l15 33H413l12-33Z" fill="#EC8A78" stroke="none"/>
    <path d="M543 211h32v54h-32v-54Z" fill="#D76A5E"/>
    <path d="M537 203h44v15h-44v-15Z" fill="#21304C" stroke-width="4"/>

    <path d="M214 324 386 206l171 118v168H214V324Z" fill="#FFFDF7"/>
    <path d="m187 320 199-144 199 144-18 25-181-130-181 130-18-25Z" fill="#5676B8"/>
    <path d="m213 308 173-125 174 125" stroke="#88A0D1" stroke-width="8"/>

    <!-- Upstairs window. -->
    <circle cx="386" cy="269" r="30" fill="#89CBE0"/>
    <path d="M386 240v59m-29-30h58" stroke-width="5"/>

    <!-- Large left window and flower box. -->
    <rect x="243" y="342" width="91" height="84" rx="4" fill="#87CCE2"/>
    <path d="M288.5 343v82" stroke-width="5"/>
    <path d="m251 385 34-35m11 48 28-29" stroke="#BEE9EE" stroke-width="7" opacity=".75"/>
    <path d="M237 427h104" stroke-width="8"/>
    <path d="M248 439h82l-8 28h-66l-8-28Z" fill="#DA806C"/>
    <g stroke="none">
      <circle cx="263" cy="437" r="8" fill="#F0BA5E"/>
      <circle cx="281" cy="434" r="8" fill="#E27463"/>
      <circle cx="300" cy="436" r="8" fill="#F0BA5E"/>
      <circle cx="319" cy="434" r="8" fill="#E27463"/>
    </g>

    <!-- Front porch, doorway, and small welcome light. -->
    <path d="M350 362 413 320l64 42v130H350V362Z" fill="#F4ECD8"/>
    <path d="m340 361 73-54 75 54-11 16-64-46-64 46-9-16Z" fill="#EDC974"/>
    <path d="M382 405c0-17 14-31 31-31s31 14 31 31v87h-62v-87Z" fill="#D48B62"/>
    <rect x="394" y="390" width="39" height="32" rx="3" fill="#8CCBE0" stroke-width="5"/>
    <circle cx="432" cy="451" r="4" fill="#FFD56B" stroke="none"/>
    <path d="M465 405h15v19h-15v-19Z" fill="#FFD56B" stroke-width="4"/>

    <!-- Attached garage. -->
    <rect x="497" y="386" width="101" height="106" rx="4" fill="#A6B0BF"/>
    <path d="M499 415h97m-97 27h97m-97 27h97" stroke="#677487" stroke-width="4"/>
  </g>

  <!-- Foundation, walkway, and garden detail. -->
  <path d="M208 468h147v34H208v-34Z" fill="#718294" stroke="#21304C" stroke-width="6"/>
  <path d="M208 468h147v34H208v-34Z" fill="url(#brick-pattern)"/>
  <path d="M365 489h97l12 13H352l13-13Z" fill="#B8C2C9" stroke="#21304C" stroke-width="5" stroke-linejoin="round"/>
  <path d="M351 502h125l18 41H333l18-41Z" fill="#E8E4D7"/>
  <path d="M371 515h85m-99 15h111" stroke="#C9C5BB" stroke-width="4" stroke-linecap="round"/>

  <!-- Standalone tree on the right. -->
  <g stroke="#21304C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M653 482c-21 0-38-16-38-35 0-14 8-26 20-32-2-5-3-9-3-14 0-21 16-37 36-37s36 16 36 37c0 5-1 10-3 14 13 6 21 18 21 32 0 19-17 35-38 35h-31Z" fill="#78C889"/>
    <path d="M667 414v82m0-48-16-15m16 34 18-17"/>
  </g>

  <!-- Ground line and small foreground plant. -->
  <path d="M100 502h600" stroke="#21304C" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#21304C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 501v-39"/>
    <path d="M118 480c-13 0-23-9-24-22 13-1 22 7 24 22Z" fill="#72BB81"/>
    <path d="M118 469c2-13 11-21 24-20-1 13-11 22-24 20Z" fill="#9BD098"/>
  </g>
</svg>
