<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A welcoming family business</title>
  <desc id="description">An original flat-vector illustration of a family-owned neighborhood bakery with a striped awning, cheerful shop windows, and a heart-shaped storefront sign.</desc>

